<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.conteiner{
            background-color: aqua;
            display: flex;
            border: 1px solid black;
            flex-flow: row wrap;  

        }
        div.item{
            background-color: chartreuse;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">
            A
        </div>
        <div class="item">
            outro conteudo
        </div>
        <div class="item">
            C
        </div>
        <div class="item">
            outro conteudo maior
        </div>
        
        <div class="item">
            E
        </div>
        <div class="item">
            um que é bem maior que todos
        </div>
        <div class="item">
            G
        </div>
        <div class="item">
            H
        </div>
    </div>
</body>
</html>

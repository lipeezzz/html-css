<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>

        body{
            background-color: rgba(12, 12, 237, 0.942);
            font-family: Arial, Helvetica, sans-serif;
        }

        h2{
            color: white;
            text-align: center;
        }

        
        div.conteiner{
            background-color: white;
            margin: auto;
            display: flex;
            flex-flow: row wrap;
            height: 100px;
            width: 600px;
            border-radius: 10px;     
        }

        div.item1{
            background-color: rgba(219, 219, 15, 0.855);
            text-align: center;
            border: 3px solid rgb(14, 14, 150);
            border-radius: 10px;
            margin: 10px 5px;

            /*
            flex-basis: 150px;
            margin: 10px 5px;
            flex-grow: 0;
            flex-shrink: 1;
            */

            flex: 0 1 150px;
        }

        div.item2{
            background-color: rgba(219, 219, 15, 0.855);
            text-align: center;
            border: 3px solid rgb(14, 14, 150);
            border-radius: 10px;
            margin: 10px 10px;

            /*
            flex-basis: 150px;
            flex-grow: 4;
            flex-shrink: 0;
            */

            flex: 4 0 150px;
        }

        div.item3{
            background-color: rgba(219, 219, 15, 0.855);
            text-align: center;
            border: 3px solid rgb(14, 14, 150);
            border-radius: 10px;
            margin: 10px 10px;

            /*
            flex-basis: 150px;
            flex-grow: 1;
            flex-shrink: 2;
            */

            flex: 1 2 150px;
        }


    </style>
</head>
<body>

    <h2>Primeiro Exemplo</h2>

    <div class="conteiner">
        <div class="item1">
            A
        </div>
        <div class="item2">
            B
        </div>
        <div class="item3">
            C
    </div>

    </div>
    <h2>Segundo Exemplo</h2>

    <div class="conteiner">
        <div class="item1">
            A
        </div>
        <div class="item2">
            B
        </div>
        <div class="item3">
            C
        </div>
    </div>

    <h2>Terceiro Exemplo</h2>

    <div class="conteiner">
        <div class="item1">
            A
        </div>
        <div class="item2">
            B
        </div>
        <div class="item3">
            C
        </div>
</body>
</html>
